<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  body { width: 220px; font-family: sans-serif; padding: 10px; }
  button { width: 100%; padding: 10px; font-size: 14px; cursor: pointer; }
  #status { margin-top: 8px; font-size: 11px; color: #444; min-height: 16px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
  <label style="display:block;font-size:12px;margin-bottom:6px;">
    Kaynak dil:
    <select id="srclang" style="width:100%;margin-top:3px;">
      <option value="English">English</option>
      <option value="日本語">日本語</option>
      <option value="简体中文">简体中文</option>
      <option value="繁體中文">繁體中文</option>
      <option value="한국어">한국어</option>
      <option value="Español">Español</option>
      <option value="Português">Português</option>
      <option value="Français">Français</option>
      <option value="Italiano">Italiano</option>
      <option value="Deutsch">Deutsch</option>
    </select>
  </label>
  <button id="go">Bu sayfayı Türkçe çevir</button>
  <button id="stoptr" style="margin-top:6px;">Çeviriyi kapat</button>
  <button id="clear" style="margin-top:6px;">Önbelleği temizle</button>
  <button id="diag" style="margin-top:6px;">Tanılama (log)</button>
  <label style="display:block;margin-top:8px;font-size:12px;">
    <input type="checkbox" id="noinpaint" /> Orijinal metni silme (üstüne yaz)
  </label>
  <label style="display:block;font-size:12px;">
    <input type="checkbox" id="ocronly" /> Sadece OCR (silme/çevirme yok, metni üstüne yaz)
  </label>
  <label style="display:block;font-size:12px;margin-top:4px;">
    Yazı zemini:
    <select id="bg" style="width:100%;margin-top:3px;">
      <option value="auto">Otomatik (beyaz yazı, siyah kontur)</option>
      <option value="white">Beyaz zemin (siyah yazı)</option>
      <option value="black">Siyah zemin (beyaz yazı)</option>
    </select>
  </label>
  <label style="display:block;margin-top:8px;font-size:12px;">
    <input type="checkbox" id="auto" /> Sonraki sayfaları otomatik çevir
  </label>
  <div id="status">Hazır.</div>
  <script src="popup.js"></script>
</body>
</html>
